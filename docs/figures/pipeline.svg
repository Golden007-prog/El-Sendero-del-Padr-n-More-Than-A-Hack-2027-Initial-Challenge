<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">The four-stage TRACE pipeline</title><desc id="desc">Player motion and geometry determine a status timeline. Ownership and boundary models provide scores. The constrained decoder returns H/A/D/X labels.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif}.small{font-size:15px}.body{font-size:18px}.label{font-size:14px;font-weight:700;letter-spacing:1.5px}.title{font-size:30px;font-weight:700}</style>
<rect width="1200" height="330" rx="18" fill="#f3f7f5"/><text x="36" y="49" fill="#113b34" class="title">From observations to a possession timeline</text><rect x="36" y="82" width="267" height="168" rx="12" fill="#ffffff" stroke="#ccddd5"/><text x="56" y="119" fill="#198167" class="label">01 / LIVE / DEAD</text><text x="56" y="166" fill="#173c36" class="body">Motion and geometry</text><text x="56" y="196" fill="#173c36" class="body">establish D / X support.</text><path d="M306 166h12m-5-5 5 5-5 5" fill="none" stroke="#59877a" stroke-width="2"/><rect x="323" y="82" width="267" height="168" rx="12" fill="#ffffff" stroke="#ccddd5"/><text x="343" y="119" fill="#198167" class="label">02 / OWNERSHIP</text><text x="343" y="166" fill="#173c36" class="body">330 observation features</text><text x="343" y="196" fill="#173c36" class="body">estimate H / A evidence.</text><path d="M593 166h12m-5-5 5 5-5 5" fill="none" stroke="#59877a" stroke-width="2"/><rect x="610" y="82" width="267" height="168" rx="12" fill="#ffffff" stroke="#ccddd5"/><text x="630" y="119" fill="#198167" class="label">03 / TURNOVERS</text><text x="630" y="166" fill="#173c36" class="body">Boundary evidence</text><text x="630" y="196" fill="#173c36" class="body">prices incoming switches.</text><path d="M880 166h12m-5-5 5 5-5 5" fill="none" stroke="#59877a" stroke-width="2"/><rect x="897" y="82" width="267" height="168" rx="12" fill="#ffffff" stroke="#ccddd5"/><text x="917" y="119" fill="#198167" class="label">04 / CONSTRAINED PATH</text><text x="917" y="166" fill="#173c36" class="body">Bounded shifts and</text><text x="917" y="196" fill="#173c36" class="body">complete return excursions.</text><text x="36" y="292" fill="#527268" class="small">Five bundled models · Fixed parameters · D/X support remains unchanged through both ownership stages</text></svg>
